<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

<!-- Vue -->
<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

<style>
body {
    font-family: Arial;
}

.cart-table img {
    border-radius: 5px;
}

.remove-btn {
    cursor: pointer;
    color: red;
    font-size: 20px;
}

.form-block {
    margin-top: 30px;
}

.success {
    margin-top: 30px;
    padding: 20px;
    background: #e8f5e9;
    border-left: 5px solid green;
}
/* 📱 МОБИЛКА */

@media (max-width: 768px) {

h1 {
    font-size: 24px;
    text-align: center;
}

/* таблица */
table th, table td {
    font-size: 12px;
    padding: 6px;
}

/* кнопки */
.btn {
    padding: 4px 8px;
    font-size: 12px;
}

/* форма */
.form-control {
    font-size: 14px;
}

/* картинки */
.cart-table img,
table img {
    width: 40px !important;
}
}

/* 📱 очень маленькие экраны */

@media (max-width: 480px) {

table th:nth-child(3),
table td:nth-child(3) {
    display: none; /* скрываем описание */
}

table th {
    font-size: 10px;
}

table td {
    font-size: 10px;
}
}
</style>

</head>

<body>

<div id="app" class="container">

    <h1 class="mt-4">Contact Us</h1>

    <!-- 🛒 CART -->
    <!-- 🛒 CART TABLE -->
    <div v-if="cart.length > 0" class="container mt-4">
        <div class="table-responsive">

            <table class="table table-bordered cart-table">
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Description</th>
            <th>Qty</th>
            <th></th>
        </tr>

        <tr v-for="item in cart" :key="item.id">
            <td><img :src="item.image" width="60"></td>
            <td>{{ item.title }}</td>
            <td>{{ item.short_text }}</td>

            <td>
                <div class="d-flex align-items-center justify-content-center">
                    <button @click="item.qty--" class="btn btn-sm btn-secondary">-</button>
                    <span class="mx-2">{{ item.qty }}</span>
                    <button @click="item.qty++" class="btn btn-sm btn-secondary">+</button>
                </div>
            </td>
            <td>
                <span @click="removeFromCart(item.id)" style="cursor:pointer; color:red;">✖</span>
            </td>
        </tr>

    </table>
</div>
</div>

    <!-- 📩 FORM -->
    <form v-if="!orderDone" @submit.prevent="makeOrder" class="form-block">

        <div class="form-group">
            <input type="text" class="form-control" placeholder="Name*" v-model="contactFields.name" required>
        </div>

        <div class="form-group">
            <input type="email" class="form-control" placeholder="Email*" v-model="contactFields.email" required>
        </div>

        <div class="form-group">
            <textarea class="form-control" placeholder="Message*" v-model="contactFields.message" required></textarea>
        </div>

        <button type="submit" class="btn btn-success">Send</button>

    </form>

    <!-- ✅ RESULT -->
    <div v-if="orderDone" class="success">

        <h3>Order sent!</h3>

        <p><b>Name:</b> {{ contactFields.name }}</p>
        <p><b>Email:</b> {{ contactFields.email }}</p>
        <p><b>Message:</b> {{ contactFields.message }}</p>

    </div>

</div>

<!-- JS -->
<script>
    new Vue({
        el: '#app',
    
        data: {
            products: [
                { id: 1, title: "Onion Classic", short_text: "Свежий лук", image: "images/cebyl2.jpg" },
                { id: 2, title: "Onion Fresh", short_text: "Сочный", image: "images/cebyl3.jpg" },
                { id: 3, title: "Onion Premium", short_text: "Премиум", image: "images/cebyl4.jpg" }
            ],
    
            cart: [],
            contactFields: {
                name: "",
                email: "",
                message: ""
            },
            orderDone: false
        },
    
        methods: {
    
            getCart() {
    let stored = JSON.parse(localStorage.getItem('cart')) || [];

    this.cart = stored.map(cartItem => {
        let product = this.products.find(p => p.id === cartItem.id);

        return {
            ...product,
            qty: cartItem.qty
        };
    });
},
    
            removeFromCart(id) {
                let ids = JSON.parse(localStorage.getItem('cart')) || [];
    
                ids = ids.filter(i => i !== id);
    
                localStorage.setItem('cart', JSON.stringify(ids));
    
                this.getCart();
            },
    
            makeOrder() {
                this.orderDone = true;
    
                this.cart = [];
                localStorage.removeItem('cart');
            }
        },
    
        mounted() {
            // 🔥 ВАЖНО: чтобы сразу были товары
            if (!localStorage.getItem('cart')) {
                localStorage.setItem('cart', JSON.stringify([1,2,3]));
            }
    
            this.getCart();
        }
    });
    </script>

</body>
</html>
